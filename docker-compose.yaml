services:
  postgres:
    image: postgres:16-alpine
    container_name: gin-api-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mypassword}
      POSTGRES_DB: ${DATABASE_NAME:-gin-api-1}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-gin-api-1}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gin-api-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOSE_DBSTRING: host=postgres user=${DATABASE_USERNAME} password=${DATABASE_PASSWORD} dbname=${DATABASE_NAME} sslmode=disable
    ports:
      - "${PORT:-3700}:${PORT:-3700}"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: