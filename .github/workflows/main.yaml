name: Team Flow Application CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - run: go mod download

      - run: test -z "$(gofmt -l .)"

      - run: make test

      - run: make build