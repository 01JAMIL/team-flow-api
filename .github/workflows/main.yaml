name: Team Flow Application CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - run: go mod download

      - run: test -z "$(gofmt -l .)"

      - run: make test

      - run: make build

  docker:
    # Make docker job wait for test so this job depends on the test job.
    # needs transfers the dependency relationship, not the filesystem.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: echo "The version is ( ${{ github.ref_name }} )"

      - uses: docker/setup-buildx-action@v3 # Buildx is Docker's modern build system.

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 01jamil/team-flow:latest