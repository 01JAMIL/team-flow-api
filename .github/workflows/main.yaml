name: Team Flow Application CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - run: go mod download

      - run: test -z "$(gofmt -l .)"

      - run: make test

      - run: make build

  docker:
    if: github.event_name == 'push'

    # Make docker job wait for test so this job depends on the test job.
    # needs transfers the dependency relationship, not the filesystem.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: echo "The version is ( ${{ github.ref_name }} )"

      - uses: docker/setup-buildx-action@v3 # Buildx is Docker's modern build system.

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: 01jamil/team-flow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: docker
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    environment: Development

    steps:
      - name: Trigger Development Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"

  deploy-prod:
    needs: docker
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment: Production

    steps:
      - name: Trigger Production Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}